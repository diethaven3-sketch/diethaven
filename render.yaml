services:
  - type: web
    name: diethaven-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: bun install && bun run build && bun x prisma migrate deploy --schema=packages/database/prisma/schema.prisma
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: diethaven-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: DietHaven Consult <onboarding@resend.dev>
      - key: WEB_ORIGIN
        value: http://localhost:3000

databases:
  - name: diethaven-db
    databaseName: diethaven
    user: diethaven_user
    plan: free
    region: oregon
